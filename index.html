<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💖</title>
    <style>
        body { margin:0; font-family:sans-serif; background:#000; color:white; text-align:center; overflow:hidden; }
        .screen { display:none; height:100vh; justify-content:center; align-items:center; flex-direction:column; padding: 20px; }
        .active { display:flex; }
        
        /* Photos */
        .main-pic { width:180px; border-radius:15px; margin-bottom:15px; border: 2px solid #ff4d6d; }
        .gallery { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 15px 0; }
        .gallery img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid #fff; }

        /* Passcode */
        .input-box { display:flex; gap:10px; margin:15px; }
        .input-box input { width:45px; height:45px; font-size:1.5em; text-align:center; border-radius:10px; border:none; }
        
        .shake { animation: shake 0.4s; }
        @keyframes shake { 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } }

        button { padding:12px 20px; border:none; border-radius:20px; background:#ff4d6d; color:white; font-weight:bold; cursor:pointer; }
        .candle { font-size:50px; cursor:pointer; margin: 10px; }

        /* Animations */
        .heart { position:fixed; font-size:20px; z-index:9999; animation: float 3s linear forwards; }
        @keyframes float { 0% { transform: translateY(0); opacity:1; } 100% { transform: translateY(-300px); opacity:0; } }
        .confetti { position: fixed; width: 8px; height: 8px; top: -10px; z-index: 9999; animation: fall linear forwards; }
        @keyframes fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

<audio id="music" loop>
    <source src="bday.mp3" type="audio/mpeg">
</audio>

<div class="screen active" id="lock">
    <img src="pic1.jpeg" class="main-pic">
    <h2>Enter Passcode 💖</h2>
    <div class="input-box" id="inputs">
        <input type="number" pattern="\d*" maxlength="1" oninput="move(this,0)">
        <input type="number" pattern="\d*" maxlength="1" oninput="move(this,1)">
        <input type="number" pattern="\d*" maxlength="1" oninput="move(this,2)">
        <input type="number" pattern="\d*" maxlength="1" oninput="move(this,3)">
    </div>
    <p>Hint: your birthdate 🎂</p>
    <button onclick="startMusic()" id="musicBtn" style="font-size: 0.8em; opacity: 0.7;">Tap to enable sound 🔊</button>
</div>

<div class="screen" id="success">
    <h1>🎉 HAPPY BIRTHDAY 💖</h1>
    <div class="gallery">
        <img src="pic2.jpeg">
        <img src="pic3.jpeg">
        <img src="pic4.jpeg">
    </div>
    <p>You unlocked my heart 🥹</p>
    <button onclick="nextScreen()">Next 👉</button>
</div>

<div class="screen" id="candle">
    <h2>Make a wish… 🥹</h2>
    <div>
        <span class="candle" onclick="blow(this)">🕯️</span>
        <span class="candle" onclick="blow(this)">🕯️</span>
        <span class="candle" onclick="blow(this)">🕯️</span>
    </div>
    <button onclick="nextScreen()">Next 🎂</button>
</div>

<div class="screen" id="final">
    <h1>💌 For You</h1>
    <p style="padding:0 20px;">
        You are not just my sister… you are my home 🥹💖<br><br>
        I am so lucky to have you in my life ❤️
    </p>
</div>

<script>
let screens = ["lock","success","candle","final"];
let current = 0;
let music = document.getElementById("music");

function startMusic() {
    music.play();
    document.getElementById('musicBtn').style.display = 'none';
}

function move(el, index) {
    // Try to play music when they start typing
    music.play().catch(() => {});
    if(el.value.length >= 1 && index < 3) {
        document.querySelectorAll("input")[index+1].focus();
    }
    checkCode();
}

function checkCode() {
    let inputs = document.querySelectorAll("input");
    let code = "";
    inputs.forEach(i => code += i.value);

    if(code.length === 4) {
        if(code === "1604") {
            music.play();
            unlockEffects();
            setTimeout(() => showScreen("success"), 1000);
        } else {
            wrongCode();
        }
    }
}

function unlockEffects() {
    for(let i=0;i<50;i++) {
        setTimeout(() => {
            let h = document.createElement("div");
            h.classList.add("heart");
            h.innerHTML = "💖";
            h.style.left = Math.random() * 100 + "vw";
            h.style.top = "70%";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 3000);
        }, i * 50);
    }
}

function wrongCode() {
    let box = document.getElementById("inputs");
    box.classList.add("shake");
    setTimeout(() => box.classList.remove("shake"), 400);
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.querySelectorAll("input")[0].focus();
}

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function nextScreen() {
    music.play();
    current++;
    showScreen(screens[current]);
}

function blow(c) { c.innerHTML = "💨"; }
</script>
</body>
</html>
