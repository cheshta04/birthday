<script>
let screens = ["lock","success","candle","final"];
let current = 0;
let music = document.getElementById("music");

/* move input */
function move(el,index){
    if(el.value.length===1 && index<3){
        document.querySelectorAll("input")[index+1].focus();
    }
    checkCode();
}

/* check code */
function checkCode(){
    let inputs = document.querySelectorAll("input");
    let code = "";
    inputs.forEach(i => code += i.value);

    if(code.length === 4){
        if(code === "1604"){
            unlockEffects();
            setTimeout(()=>showScreen("success"),1200);
        } else {
            wrongCode();
        }
    }
}

/* correct effects */
function unlockEffects(){

    // 🎵 FIX: play music after user interaction
    document.body.addEventListener("click", () => {
        music.play();
    }, { once: true });

    // 💖 HEARTS
    for(let i=0;i<40;i++){
        let h=document.createElement("div");
        h.classList.add("heart");
        h.innerHTML="💖";
        h.style.left=Math.random()*100+"vw";
        h.style.top=(Math.random()*50+50)+"%";
        h.style.fontSize=(Math.random()*20+15)+"px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),3000);
    }

    // 🎆 CONFETTI
    for(let i=0;i<120;i++){
        let c=document.createElement("div");
        c.classList.add("confetti");

        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,50%)`;
        c.style.width="8px";
        c.style.height="8px";
        c.style.animationDuration=(Math.random()*2+2)+"s";

        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

/* wrong code */
function wrongCode(){
    let box=document.getElementById("inputs");
    box.classList.add("shake");

    setTimeout(()=>box.classList.remove("shake"),400);

    document.querySelectorAll("input").forEach(i=>i.value="");
    document.querySelectorAll("input")[0].focus();
}

/* navigation */
function showScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function nextScreen(){
    current++;
    showScreen(screens[current]);
}

/* candles */
function blow(c){
    c.innerHTML="💨";
}
</script>
